packages:
  - apps/*
  - packages/*
allowBuilds:
  electron-winstaller: false
  esbuild: true
  node-pty: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.30'
  - '@expo/prebuild-config@57.0.19'
  - expo-asset@57.0.20
  - expo-constants@57.0.22
  - expo-modules-autolinking@57.0.16
  - expo-modules-core@57.0.23
  - expo@57.0.29
  - '@expo/metro-runtime@57.0.17'
  - '@expo/ui@57.0.24'
  - expo-linking@57.0.13
  - expo-router@57.0.27
  - expo-notifications@57.0.23
# The patch is for the phone app; installs that leave it out (the server, agentd) must not fail.
allowUnusedPatches: true
patchedDependencies:
  expo-modules-jsi@57.1.2: patches/expo-modules-jsi@57.1.2.patch
