name: kovan

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kovan
      POSTGRES_PASSWORD: kovan
      POSTGRES_DB: kovan
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kovan']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
