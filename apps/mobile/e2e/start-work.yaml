# Starting work from the phone against a local server where alice's desktop is online with
# fixture-repo set up (sign-in finished from outside, as in sign-in.yaml): a new session with a
# first prompt that her desktop runs, its approval answered here, then a second prompt.
appId: dev.alperkayan.kovan
env:
  SERVER: http://localhost:4807
---
- runFlow: flows/sign-in-local.yaml
- tapOn: 'fixture-repo.*'
- tapOn: 'New session'
- tapOn: 'Session title'
- inputText: 'Phone start check'
- assertVisible: 'New branch kovan/phone-start-check(-[0-9]+)?'
# A text box reads as its label and then its placeholder.
- tapOn: '.*First prompt for your agent.*'
- inputText: 'Add a range(values) function to src/stats.js that returns max minus min, with one JSDoc line like mean. Make exactly one edit_file call and do not run any commands.'
- tapOn: 'Start'
# The desktop takes it: a worktree for the branch, a lane, a new turn.
- extendedWaitUntil:
    visible: 'Your agent started on your desktop\.'
    timeout: 30000
- extendedWaitUntil:
    visible: 'Approve'
    timeout: 120000
- tapOn: 'Approve'
# The model may ask once more (to fix its own edit): every ask is approved until it is done.
- repeat:
    times: 20
    while:
      notVisible: 'Nothing running.*'
    commands:
      - tapOn:
          text: 'Approve'
          optional: true
- assertVisible: 'Nothing running.*'
# Nothing running: the box asks the agent again (a new turn on the desktop).
- tapOn: '.*Ask your agent.*'
- inputText: 'Do not edit anything. Reply with only the word spread written backwards in capital letters.'
- tapOn: 'Send'
- extendedWaitUntil:
    visible: 'Your agent started on your desktop\.'
    timeout: 30000
# The reply streams in from the desktop (the prompt itself doesn't contain it).
- extendedWaitUntil:
    visible: '.*DAERPS.*'
    timeout: 120000
